version: '3.8'

services:
  # One-off job that creates the schema in the postgres service below via
  # `prisma db push` before `app` starts. Uses the `builder` stage because it
  # has the Prisma CLI (a devDependency, stripped from the slim runtime image).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/audible_pulse
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "db", "push", "--skip-generate", "--accept-data-loss"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/audible_pulse
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=audible-pulse-super-secret-key-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: audible_pulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
